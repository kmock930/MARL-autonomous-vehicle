name: MARL Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install numpy matplotlib
        pip install -e .
    
    - name: Test core functionality (no ML dependencies)
      run: |
        pytest tests_new/ -v --cov=src/marl_autonomous_vehicle --cov-report=xml
    
    - name: Test with ML dependencies (Python 3.9+)
      if: matrix.python-version != '3.8'
      run: |
        pip install tensorflow>=2.8.0
        pytest tests_new/ -v
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    
    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy
        pip install -e .
    
    - name: Run black
      run: black --check src/ tests_new/
    
    - name: Run isort
      run: isort --check-only src/ tests_new/
    
    - name: Run flake8
      run: flake8 src/ tests_new/ --max-line-length=100
    
    - name: Run mypy
      run: mypy src/ --ignore-missing-imports